# Codemagic CI/CD — iOS Ad-Hoc (.ipa) derlemesi
#
# Codemagic tarafında bir kez yapılacaklar:
#  1) Teams > Code signing identities:
#       - iOS Distribution sertifikası (.p12)
#       - Ad-Hoc provisioning profile (HealthKit yetkisi açık App ID için,
#         cihaz UDID'in profile ekli olmalı)
#  2) Environment variables > "app_secrets" grubu (hepsi Secure):
#       SUPABASE_URL, SUPABASE_ANON_KEY, GEMINI_API_KEY
#  3) Aşağıdaki BUNDLE_ID değerini kendi App ID'nle değiştir
#     (iki yerde: ios_signing.bundle_identifier ve vars.BUNDLE_ID).
#
# ios/ klasörünü depoya koymak gerekmez: yoksa derleme sırasında BUNDLE_ID ile
# üretilir ve tool/configure_ios.sh ile yapılandırılır. Depoda varsa o kullanılır.

workflows:
  ios-adhoc:
    name: iOS Ad-Hoc
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_secrets
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ornek.kisiselAsistan
      vars:
        BUNDLE_ID: com.ornek.kisiselAsistan

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Ortam değişkenlerini doğrula
        script: |
          #!/usr/bin/env bash
          set -e
          for key in SUPABASE_URL SUPABASE_ANON_KEY GEMINI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Eksik ortam değişkeni: $key (app_secrets grubuna ekle)"
              exit 1
            fi
          done

      # ios/ depoda tutulmuyorsa burada üretilir (Mac gerekmez). --org, BUNDLE_ID'nin
      # son parçası hariç kısmıdır; depoda ios/ varsa bu adım hiçbir şey yapmaz.
      # Sıra önemli: Podfile ve eklenti kayıtları bir sonraki "flutter pub get" ile oluşur.
      - name: iOS projesini oluştur (ios/ depoda yoksa)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "ios/ depoda var; yeniden oluşturulmadı."
            exit 0
          fi
          BUNDLE_ID="${BUNDLE_ID:-}"
          ORG="${BUNDLE_ID%.*}"
          if [ -z "$ORG" ] || [ "$ORG" = "$BUNDLE_ID" ]; then
            echo "HATA: BUNDLE_ID 'com.sirket.uygulama' biçiminde olmalı (şu an: '$BUNDLE_ID')." >&2
            exit 1
          fi
          # flutter create, pubspec.lock'u yalnızca SDK'nın sabitlediği sürümlerle
          # yeniden yazar (depodaki kilitli sürümler kaybolur); depodaki hâli korunur.
          KEEP="$(mktemp -d)"
          cp pubspec.lock "$KEEP/"
          flutter create --no-pub --platforms=ios --org "$ORG" --project-name kisisel_asistan .
          cp "$KEEP/pubspec.lock" pubspec.lock

      - name: Bağımlılıkları yükle
        script: flutter pub get

      - name: iOS projesini yapılandır (HealthKit, Info.plist)
        script: bash tool/configure_ios.sh

      # Uygulamanın kimliği (dosyadaki en kısa kimlik) BUNDLE_ID yapılır; ona bağlı
      # kimlikler (RunnerTests) aynı önekle güncellenir ki eski önekte kalmasın.
      - name: Bundle ID'yi ayarla
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
          perl -0777 -pi -e '
            my @ids = /PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;/g;
            my ($old) = sort { length($a) <=> length($b) } @ids;
            s/(PRODUCT_BUNDLE_IDENTIFIER = )"?\Q$old\E((?:\.[^";]+)?)"?;/$1$ENV{BUNDLE_ID}$2;/g
              if defined $old;
          ' "$PBXPROJ"
          if ! grep -qF "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBXPROJ"; then
            echo "HATA: Bundle ID (${BUNDLE_ID}) project.pbxproj dosyasına yazılamadı." >&2
            exit 1
          fi
          STALE="$(grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBXPROJ" \
            | grep -vF "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" \
            | grep -vF "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}." || true)"
          if [ -n "$STALE" ]; then
            echo "HATA: BUNDLE_ID ile başlamayan kimlik kaldı:" >&2
            echo "$STALE" >&2
            exit 1
          fi
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBXPROJ" | sort | uniq -c

      - name: Statik analiz
        script: flutter analyze --no-fatal-infos

      - name: Testler
        script: |
          if [ -d test ]; then flutter test; else echo "test klasörü yok, atlandı"; fi

      - name: İmzalama profillerini projeye uygula
        script: xcode-project use-profiles

      - name: Ad-Hoc IPA derle
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
