# Codemagic CI/CD — iOS Ad-Hoc (.ipa) derlemesi
#
# Codemagic tarafında bir kez yapılacaklar:
#  1) Teams > Code signing identities:
#       - iOS Distribution sertifikası (.p12)
#       - Ad-Hoc provisioning profile (HealthKit yetkisi açık App ID için,
#         cihaz UDID'in profile ekli olmalı)
#  2) Environment variables > "app_secrets" grubu (hepsi Secure):
#       SUPABASE_URL, SUPABASE_ANON_KEY, GEMINI_API_KEY
#  3) Aşağıdaki BUNDLE_ID değerini kendi App ID'nle değiştir
#     (iki yerde: ios_signing.bundle_identifier ve vars.BUNDLE_ID).

workflows:
  ios-adhoc:
    name: iOS Ad-Hoc
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_secrets
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ornek.kisiselAsistan
      vars:
        BUNDLE_ID: com.ornek.kisiselAsistan

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Ortam değişkenlerini doğrula
        script: |
          #!/usr/bin/env bash
          set -e
          for key in SUPABASE_URL SUPABASE_ANON_KEY GEMINI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Eksik ortam değişkeni: $key (app_secrets grubuna ekle)"
              exit 1
            fi
          done

      - name: Bağımlılıkları yükle
        script: flutter pub get

      - name: iOS projesini yapılandır (HealthKit, Info.plist)
        script: bash tool/configure_ios.sh

      - name: Bundle ID'yi ayarla
        script: |
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*kisiselAsistan;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/" ios/Runner.xcodeproj/project.pbxproj

      - name: Statik analiz
        script: flutter analyze --no-fatal-infos

      - name: Testler
        script: |
          if [ -d test ]; then flutter test; else echo "test klasörü yok, atlandı"; fi

      - name: İmzalama profillerini projeye uygula
        script: xcode-project use-profiles

      - name: Ad-Hoc IPA derle
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
