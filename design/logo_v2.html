<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0b0b;font:600 15px -apple-system,system-ui,sans-serif;color:#eee;padding:28px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.c{text-align:center}
.t{width:190px;height:190px;border-radius:42px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}

</style></head><body><div class="g" id="g"></div><script>
const M={
A:`<path d="M50 14c11 14 11 22 0 36s-11 22 0 36" fill="none" stroke="C" stroke-width="12" stroke-linecap="round"/><path d="M50 14c-20 4-34 18-34 36s14 32 34 36" fill="none" stroke="C" stroke-width="12" stroke-linecap="round" opacity=".45"/><path d="M50 14c20 4 34 18 34 36s-14 32-34 36" fill="none" stroke="C" stroke-width="12" stroke-linecap="round" opacity=".45"/>`,
B:`<rect x="14" y="14" width="40" height="40" rx="12" fill="C"/><rect x="60" y="14" width="26" height="72" rx="12" fill="C" opacity=".55"/><rect x="14" y="60" width="40" height="26" rx="12" fill="C" opacity=".8"/>`,
C:`<circle cx="50" cy="50" r="36" fill="C"/><path d="M14 52c12-14 24-14 36 0s24 14 36 0" fill="none" stroke="BG" stroke-width="10" stroke-linecap="round"/>`,
D:`<path d="M50 12c21 0 38 17 38 38S71 88 50 88c-12 0-22-6-22-16s10-14 22-14 22-6 22-14-10-14-22-14S28 24 28 22 38 12 50 12z" fill="C"/>`,
E:`<circle cx="34" cy="50" r="22" fill="C"/><circle cx="66" cy="50" r="22" fill="C" opacity=".5"/>`,
F:`<g fill="C"><rect x="18" y="38" width="14" height="24" rx="7"/><rect x="43" y="16" width="14" height="68" rx="7"/><rect x="68" y="30" width="14" height="40" rx="7"/></g><circle cx="50" cy="50" r="40" fill="none" stroke="C" stroke-width="6" opacity=".35"/>`};
const names={A:"Dalga çekirdek",B:"Bento",C:"Ufuk dalgası",D:"Akış damlası",E:"İki halka",F:"Ritim + çember"};
const P=[["#000","#5EEAD4"],["#0E736B","#F4F1EA"],["#F4F1EA","#0E736B"]];
const svg=(k,bg,fg,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100">${M[k].replaceAll('BG',bg).replaceAll('C',fg)}</svg>`;
document.getElementById('g').innerHTML=Object.keys(M).map((k,i)=>{const [bg,fg]=P[i%3];return `<div class="c"><div class="t" style="background:${bg}">${svg(k,bg,fg,120)}</div><div class="s" style="background:${bg}">${svg(k,bg,fg,38)}</div>${String.fromCharCode(65+i)} · ${names[k]}</div>`}).join('');
</script></body></html>
